[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "text2cypher"
version = "0.1.0"
description = "面向 Neo4j 代码知识图谱的安全 Text2Cypher 基础工程。"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Text2Cypher contributors" }]
dependencies = [
    "httpx>=0.28,<1.0",
    "neo4j>=6.0,<7.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
text2cypher = "text2cypher.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text2cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
